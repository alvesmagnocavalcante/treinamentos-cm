<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>{% block title %}Treinamento interno{% endblock %}</title>
  <script src="{{ static('theme.js') }}?v=1"></script>
  {% block framework_styles %}<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">{% endblock %}
  <link href="{{ static('brand.css') }}?v=3" rel="stylesheet">
  <link href="{{ static('app.css') }}?v=11" rel="stylesheet">
</head>
<body class="{% block body_class %}platform-page{% endblock %}">
  {% block navigation %}
  <nav class="navbar navbar-dark bg-dark mb-4" aria-label="Navegação principal">
    <div class="container">
      <a class="navbar-brand" href="/" aria-label="Carmel — início dos treinamentos"><img src="{{ static('brand/carmel-hoteis.png') }}" alt="Carmel Hotéis" width="112" height="48"></a>
      <a class="text-white" href="/admin/">Administração</a>
      {% include "_theme_toggle.html" %}
    </div>
  </nav>
  {% endblock %}
  <main id="main-content" class="{% block main_class %}container pb-5{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
